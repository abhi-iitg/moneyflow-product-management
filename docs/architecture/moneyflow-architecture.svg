<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc">
<title id="title">MoneyFlow Personal Finance Product Architecture</title>
<desc id="desc">Modern SaaS architecture diagram showing MoneyFlow from user inputs through Streamlit, services, deterministic analytics, optional AI, persistence, and product outputs.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#eff6ff"/><stop offset="55%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#ecfeff"/></linearGradient>
<linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1d4ed8"/><stop offset="100%" stop-color="#0f766e"/></linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/></filter>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
<style>
.title{font:700 34px Inter,Arial,sans-serif;fill:#fff}.subtitle{font:400 16px Inter,Arial,sans-serif;fill:#dbeafe}.section{font:700 15px Inter,Arial,sans-serif;fill:#0f172a;letter-spacing:1px}.card-title{font:700 18px Inter,Arial,sans-serif;fill:#0f172a}.body{font:400 14px Inter,Arial,sans-serif;fill:#475569}.small{font:500 12px Inter,Arial,sans-serif;fill:#64748b}.footer{font:600 14px Inter,Arial,sans-serif;fill:#e2e8f0}
</style></defs>
<rect width="1600" height="860" rx="28" fill="url(#bg)"/>
<rect width="1600" height="142" rx="28" fill="url(#header)"/><rect y="112" width="1600" height="30" fill="url(#header)"/>
<text x="72" y="62" class="title">MoneyFlow — Personal Finance Product Architecture</text>
<text x="72" y="98" class="subtitle">Privacy-first decision support • deterministic financial core • optional AI insights</text>
<text x="72" y="190" class="section">USER EXPERIENCE</text><text x="72" y="462" class="section">APPLICATION AND DOMAIN LAYERS</text><text x="72" y="690" class="section">PERSISTENCE, TRUST AND LEARNING</text>
<g filter="url(#shadow)"><rect x="72" y="220" width="240" height="172" rx="18" fill="#fff" stroke="#bfdbfe"/><rect x="72" y="220" width="240" height="10" rx="5" fill="#2563eb"/><text x="96" y="264" class="card-title">1. User Inputs</text><text x="96" y="294" class="body">CSV transaction import</text><text x="96" y="320" class="body">Budget and savings goals</text><text x="96" y="346" class="body">Category corrections</text><text x="96" y="372" class="small">User-controlled financial data</text></g>
<g filter="url(#shadow)"><rect x="350" y="220" width="240" height="172" rx="18" fill="#fff" stroke="#bae6fd"/><rect x="350" y="220" width="240" height="10" rx="5" fill="#0891b2"/><text x="374" y="264" class="card-title">2. Streamlit UI</text><text x="374" y="294" class="body">Dashboard and navigation</text><text x="374" y="320" class="body">Tables and interactive charts</text><text x="374" y="346" class="body">Actionable check-in flow</text><text x="374" y="372" class="small">Session-state driven experience</text></g>
<g filter="url(#shadow)"><rect x="628" y="220" width="240" height="172" rx="18" fill="#fff" stroke="#c7d2fe"/><rect x="628" y="220" width="240" height="10" rx="5" fill="#4f46e5"/><text x="652" y="264" class="card-title">3. Services</text><text x="652" y="294" class="body">File processing orchestration</text><text x="652" y="320" class="body">Validation and state setup</text><text x="652" y="346" class="body">AI enablement and fallbacks</text><text x="652" y="372" class="small">Coordinates the product workflow</text></g>
<g filter="url(#shadow)"><rect x="906" y="220" width="240" height="172" rx="18" fill="#fff" stroke="#bbf7d0"/><rect x="906" y="220" width="240" height="10" rx="5" fill="#16a34a"/><text x="930" y="264" class="card-title">4. Deterministic Core</text><text x="930" y="294" class="body">CSV parsing and standardization</text><text x="930" y="320" class="body">Analytics and categorization</text><text x="930" y="346" class="body">Recurring and unusual rules</text><text x="930" y="372" class="small">Financial figures remain explainable</text></g>
<g filter="url(#shadow)"><rect x="1184" y="220" width="344" height="172" rx="18" fill="#fff" stroke="#fde68a"/><rect x="1184" y="220" width="344" height="10" rx="5" fill="#d97706"/><text x="1208" y="264" class="card-title">5. Product Outputs</text><text x="1208" y="294" class="body">Cash-flow visibility and trends</text><text x="1208" y="320" class="body">Budget and savings planning</text><text x="1208" y="346" class="body">Explainable insights and next actions</text><text x="1208" y="372" class="small">Measure meaningful financial follow-through</text></g>
<g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M312 306 H350"/><path d="M590 306 H628"/><path d="M868 306 H906"/><path d="M1146 306 H1184"/></g>
<g filter="url(#shadow)"><rect x="72" y="492" width="470" height="146" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="98" y="534" class="card-title">Persistence Layer</text><text x="98" y="566" class="body">SQLAlchemy data-access layer</text><text x="98" y="592" class="body">SQLite locally • PostgreSQL option</text><text x="98" y="618" class="small">Per-user storage and controlled save operations</text></g>
<g filter="url(#shadow)"><rect x="565" y="492" width="470" height="146" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="591" y="534" class="card-title">Optional AI Layer</text><text x="591" y="566" class="body">Provider interface and prompt builder</text><text x="591" y="592" class="body">Local model or OpenAI-compatible endpoint</text><text x="591" y="618" class="small">Opt-in; never required for deterministic analytics</text></g>
<g filter="url(#shadow)"><rect x="1058" y="492" width="470" height="146" rx="18" fill="#fff" stroke="#cbd5e1"/><text x="1084" y="534" class="card-title">Trust and Safety Controls</text><text x="1084" y="566" class="body">Input validation and rate limiting</text><text x="1084" y="592" class="body">Secrets and data excluded from Git</text><text x="1084" y="618" class="small">No payments, investment advice, or autonomous actions</text></g>
<g stroke="#94a3b8" stroke-width="2.5" fill="none" stroke-dasharray="8 7" marker-end="url(#arrow)"><path d="M1026 392 V450 H307 V492"/><path d="M1026 392 V450 H800 V492"/><path d="M1300 392 V492"/></g>
<rect x="72" y="720" width="1456" height="78" rx="16" fill="#0f172a"/><text x="100" y="752" class="footer">Learning loop</text><text x="100" y="778" class="small" fill="#cbd5e1">Instrument check-ins → evaluate activation and retention → protect privacy guardrails → prioritize the next iteration</text><text x="1275" y="752" class="footer">Stack</text><text x="1275" y="778" class="small" fill="#cbd5e1">Python • Streamlit • pandas • Plotly • SQLAlchemy • pytest</text>
</svg>
